[project]
name = "anywhere-stack"
version = "0.1.0"
description = "Repo-centric modular agent stack powered by NVIDIA Nemotron on Nebius"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0.0",
    "slack-bolt>=1.18.0",
    "pygithub>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
anywhere = "anywhere.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anywhere"]
